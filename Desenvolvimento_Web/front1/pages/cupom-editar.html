<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons - Editar</title>
</head>
<body>
    <main>
        <header>
            <h1>Cupons - Editar</h1>
            <p>Atualizacao de cupom existente pelo codigo.</p>
            <a href="index.html">Logout</a>
        </header>


        <section>
            <h2>Selecionar cupom</h2>
            <div>
                <div>
                    <label for="codigo">Codigo do cupom</label>
                    <input id="codigo" type="text" placeholder="PROMO20" readonly>
                </div>
            </div>
        </section>

        <section>
            <h2>Novos dados</h2>
            <div>
                <div>
                    <label for="desconto">Percentual de desconto</label>
                    <input id="desconto" type="number" step="0.01" placeholder="25" readonly>
                </div>
                <div>
                    <label for="quantidade">Numero de cupons</label>
                    <input id="quantidade" type="number" placeholder="30" readonly>
                </div>
            </div>
            <div>Cupom atualizado com sucesso. (mensagem de exemplo)</div>
        </section>

        <section>
            <div>
                <a href="cupom-listar.html">Ver lista de cupons</a>
            </div>
        </section>
    </main>
</body>
</html>
