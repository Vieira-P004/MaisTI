<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Companhia - Editar</title>
</head>
<body>
    <main>
        <header>
            <h1>Companhia - Editar</h1>
            <p>Atualizacao de dados de uma companhia cadastrada.</p>
            <a href="index.html">Logout</a>
        </header>


        <section>
            <h2>Selecionar companhia</h2>
            <div>
                <div>
                    <label for="idCompanhia">ID da companhia</label>
                    <input id="idCompanhia" type="number" placeholder="Ex: 1" readonly>
                </div>
            </div>
        </section>

        <section>
            <h2>Novos dados</h2>
            <div>
                <div>
                    <label for="nome">Nome da companhia</label>
                    <input id="nome" type="text" placeholder="Aero Sul" readonly>
                </div>
                <div>
                    <label for="website">Website</label>
                    <input id="website" type="url" placeholder="https://www.aerosul.com.br" readonly>
                </div>
                <div>
                    <label for="fundacao">Ano de fundacao</label>
                    <input id="fundacao" type="number" placeholder="1998" readonly>
                </div>
            </div>
            <div>Companhia atualizada com sucesso. (mensagem de exemplo)</div>
        </section>

        <section>
            <div>
                <a href="companhia-listar.html">Ver lista de companhias</a>
            </div>
        </section>
    </main>
</body>
</html>
