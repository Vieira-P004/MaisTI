<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons - Cadastrar</title>
</head>
<body>
    <main>
        <header>
            <h1>Cupons - Cadastrar</h1>
            <p>Informa companhia, codigo, percentual e quantidade de cupons disponiveis.</p>
            <a href="index.html">Logout</a>
        </header>


        <section>
            <h2>Novo cupom</h2>
            <div>
                <div>
                    <label for="idCompanhia">ID da companhia</label>
                    <input id="idCompanhia" type="number" placeholder="Ex: 1" readonly>
                </div>
                <div>
                    <label for="codigo">Codigo</label>
                    <input id="codigo" type="text" placeholder="PROMO20" readonly>
                </div>
                <div>
                    <label for="desconto">Percentual de desconto</label>
                    <input id="desconto" type="number" step="0.01" placeholder="20" readonly>
                </div>
                <div>
                    <label for="quantidade">Numero de cupons</label>
                    <input id="quantidade" type="number" placeholder="100" readonly>
                </div>
            </div>
            <p>Se a companhia nao existir, direcionar para cadastro de companhia.</p>
        </section>

        <section>
            <div>
                <a href="companhia-cadastrar.html">Cadastrar nova companhia</a>
                <a href="cupom-listar.html">Ver lista de cupons</a>
            </div>
        </section>
    </main>
</body>
</html>
