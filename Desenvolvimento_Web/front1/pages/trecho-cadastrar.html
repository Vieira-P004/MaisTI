<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trechos - Cadastrar</title>
</head>
<body>
    <main>
        <header>
            <h1>Trechos - Cadastrar</h1>
            <p>Informa companhia, origem, destino, valor e numero de passagens disponiveis.</p>
            <a href="index.html">Logout</a>
        </header>


        <section>
            <h2>Novo trecho</h2>
            <div>
                <div>
                    <label for="idCompanhia">ID da companhia</label>
                    <input id="idCompanhia" type="number" placeholder="Ex: 1" readonly>
                </div>
                <div>
                    <label for="origem">Origem</label>
                    <input id="origem" type="text" placeholder="Porto Alegre" readonly>
                </div>
                <div>
                    <label for="destino">Destino</label>
                    <input id="destino" type="text" placeholder="Sao Paulo" readonly>
                </div>
                <div>
                    <label for="valor">Valor</label>
                    <input id="valor" type="number" step="0.01" placeholder="499.90" readonly>
                </div>
                <div>
                    <label for="passagens">Numero de passagens</label>
                    <input id="passagens" type="number" placeholder="50" readonly>
                </div>
            </div>
            <p>Se o ID nao existir, direcionar para o cadastro de companhia.</p>
        </section>

        <section>
            <div>
                <a href="companhia-cadastrar.html">Cadastrar nova companhia</a>
                <a href="trecho-listar.html">Ver lista de trechos</a>
            </div>
        </section>
    </main>
</body>
</html>
