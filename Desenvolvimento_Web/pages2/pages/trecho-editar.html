<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trechos - Editar</title>
    <link rel="stylesheet" href="../public/css/app.css">
</head>
<body class="admin-panel-theme">
    <main class="page-wrap">
        <header class="hero">
            <h1>Trechos - Editar</h1>
            <p>Atualizacao de dados de um trecho existente.</p>
            <a class="hero-corner-link" href="index.html">Logout</a>
        </header>


        <section class="card-panel form-shell">
            <h2>Selecionar trecho</h2>
            <div class="row">
                <div class="col-md-4">
                    <label for="idTrecho">ID do trecho</label>
                    <input id="idTrecho" class="form-control" type="number" placeholder="Ex: 1" readonly>
                </div>
            </div>
        </section>

        <section class="card-panel form-shell">
            <h2>Novos dados</h2>
            <div class="row">
                <div class="col-md-4">
                    <label for="origem">Origem</label>
                    <input id="origem" class="form-control" type="text" placeholder="Porto Alegre" readonly>
                </div>
                <div class="col-md-4">
                    <label for="destino">Destino</label>
                    <input id="destino" class="form-control" type="text" placeholder="Curitiba" readonly>
                </div>
                <div class="col-md-4">
                    <label for="valor">Valor</label>
                    <input id="valor" class="form-control" type="number" step="0.01" placeholder="349.90" readonly>
                </div>
                <div class="col-md-4">
                    <label for="passagens">Numero de passagens</label>
                    <input id="passagens" class="form-control" type="number" placeholder="20" readonly>
                </div>
            </div>
            <div class="status-box status-ok mt-3">Trecho atualizado com sucesso. (mensagem de exemplo)</div>
        </section>

        <section class="card-panel">
            <div class="action-links">
                <a href="trecho-listar.html">Ver lista de trechos</a>
            </div>
        </section>
    </main>
</body>
</html>
