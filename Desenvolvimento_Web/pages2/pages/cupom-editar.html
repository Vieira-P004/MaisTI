<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons - Editar</title>
    <link rel="stylesheet" href="../public/css/app.css">
</head>
<body class="admin-panel-theme">
    <main class="page-wrap">
        <header class="hero">
            <h1>Cupons - Editar</h1>
            <p>Atualizacao de cupom existente pelo codigo.</p>
            <a class="hero-corner-link" href="index.html">Logout</a>
        </header>


        <section class="card-panel form-shell">
            <h2>Selecionar cupom</h2>
            <div class="row">
                <div class="col-md-5">
                    <label for="codigo">Codigo do cupom</label>
                    <input id="codigo" class="form-control" type="text" placeholder="PROMO20" readonly>
                </div>
            </div>
        </section>

        <section class="card-panel form-shell">
            <h2>Novos dados</h2>
            <div class="row">
                <div class="col-md-4">
                    <label for="desconto">Percentual de desconto</label>
                    <input id="desconto" class="form-control" type="number" step="0.01" placeholder="25" readonly>
                </div>
                <div class="col-md-4">
                    <label for="quantidade">Numero de cupons</label>
                    <input id="quantidade" class="form-control" type="number" placeholder="30" readonly>
                </div>
            </div>
            <div class="status-box status-ok mt-3">Cupom atualizado com sucesso. (mensagem de exemplo)</div>
        </section>

        <section class="card-panel">
            <div class="action-links">
                <a href="cupom-listar.html">Ver lista de cupons</a>
            </div>
        </section>
    </main>
</body>
</html>
