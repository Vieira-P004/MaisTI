<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trechos - Cadastrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../public/css/app.css">
</head>
<body class="admin-panel-theme">
    <main class="page-wrap">
        <header class="hero">
            <h1>Trechos - Cadastrar</h1>
            <p>Informa companhia, origem, destino, valor e numero de passagens disponiveis.</p>
            <a class="hero-corner-link" href="index.html">Logout</a>
        </header>


        <section class="card-panel form-shell">
            <h2>Novo trecho</h2>
            <div class="row">
                <div class="col-md-4">
                    <label for="idCompanhia">ID da companhia</label>
                    <input id="idCompanhia" class="form-control" type="number" placeholder="Ex: 1" readonly>
                </div>
                <div class="col-md-4">
                    <label for="origem">Origem</label>
                    <input id="origem" class="form-control" type="text" placeholder="Porto Alegre" readonly>
                </div>
                <div class="col-md-4">
                    <label for="destino">Destino</label>
                    <input id="destino" class="form-control" type="text" placeholder="Sao Paulo" readonly>
                </div>
                <div class="col-md-4">
                    <label for="valor">Valor</label>
                    <input id="valor" class="form-control" type="number" step="0.01" placeholder="499.90" readonly>
                </div>
                <div class="col-md-4">
                    <label for="passagens">Numero de passagens</label>
                    <input id="passagens" class="form-control" type="number" placeholder="50" readonly>
                </div>
            </div>
            <p class="hint mt-3">Se o ID nao existir, direcionar para o cadastro de companhia.</p>
        </section>

        <section class="card-panel">
            <div class="action-links">
                <a href="companhia-cadastrar.html">Cadastrar nova companhia</a>
                <a href="trecho-listar.html">Ver lista de trechos</a>
            </div>
        </section>
    </main>
</body>
</html>
