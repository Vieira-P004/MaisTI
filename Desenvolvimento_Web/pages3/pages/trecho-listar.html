<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Trechos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../public/css/app.css">
</head>
<body class="admin-panel-theme">
    <main class="page-wrap">
        <header class="hero">
            <h1>Trechos cadastrados</h1>
            <p>Lista administrativa de trechos com acoes de manutencao.</p>
            <a class="hero-corner-link" href="index.html">Logout</a>
        </header>

        <nav class="admin-top-menu" aria-label="Menu superior da listagem">
            <a href="admin-painel.html"><i class="bi bi-arrow-left-circle"></i>Voltar ao menu</a>
            <a href="trecho-cadastrar.html"><i class="bi bi-plus-circle"></i>Adicionar trecho</a>
        </nav>

        <section class="card-panel">
            <div class="entity-list">
                <article class="entity-row">
                    <div class="entity-main">
                        <div class="entity-title">POA -> CWB (Aero Sul)</div>
                        <div class="entity-meta">Valor: R$ 320,00 | Passagens: 18</div>
                    </div>
                    <div class="entity-actions">
                        <a class="icon-action icon-action-edit" href="trecho-editar.html" title="Editar trecho" aria-label="Editar trecho"><i class="bi bi-pencil-square"></i></a>
                        <a class="icon-action icon-action-delete" href="trecho-excluir.html" title="Excluir trecho" aria-label="Excluir trecho"><i class="bi bi-trash"></i></a>
                    </div>
                </article>

                <article class="entity-row">
                    <div class="entity-main">
                        <div class="entity-title">REC -> SSA (Voa Norte)</div>
                        <div class="entity-meta">Valor: R$ 280,00 | Passagens: 35</div>
                    </div>
                    <div class="entity-actions">
                        <a class="icon-action icon-action-edit" href="trecho-editar.html" title="Editar trecho" aria-label="Editar trecho"><i class="bi bi-pencil-square"></i></a>
                        <a class="icon-action icon-action-delete" href="trecho-excluir.html" title="Excluir trecho" aria-label="Excluir trecho"><i class="bi bi-trash"></i></a>
                    </div>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
