<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Companhia - Cadastrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../public/css/app.css">
</head>
<body class="admin-panel-theme">
    <main class="page-wrap">
        <header class="hero">
            <h1>Companhia - Cadastrar</h1>
            <p>Formulario para cadastro de nova companhia no sistema administrativo.</p>
            <a class="hero-corner-link" href="index.html">Logout</a>
        </header>

        <section class="card-panel form-shell">
            <h2>Nova companhia</h2>
            <div class="row">
                <div class="col-md-6">
                    <label for="nome">Nome da companhia</label>
                    <input id="nome" class="form-control" type="text" placeholder="Ex: Aero Sul" readonly>
                </div>
                <div class="col-md-6">
                    <label for="website">Website</label>
                    <input id="website" class="form-control" type="url" placeholder="https://www.aerosul.com.br" readonly>
                </div>
                <div class="col-md-4">
                    <label for="fundacao">Ano de fundacao</label>
                    <input id="fundacao" class="form-control" type="number" placeholder="1998" readonly>
                </div>
            </div>
            <p class="hint mt-3">Tela estatica para demonstracao. A persistencia real sera conectada na camada de backend.</p>
            <div class="action-links">
                <a href="companhia-listar.html">Cancelar</a>
                <a href="companhia-listar.html">Salvar (mock)</a>
            </div>
        </section>
    </main>
</body>
</html>
