<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons - Excluir</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../public/css/app.css">
</head>
<body class="admin-panel-theme">
    <main class="page-wrap">
        <header class="hero">
            <h1>Cupons - Excluir</h1>
            <p>Remocao de cupom pelo codigo informado.</p>
            <a class="hero-corner-link" href="index.html">Logout</a>
        </header>


        <section class="card-panel">
            <h2>Cupom selecionado para exclusao</h2>
            <form action="#" method="post">
                <input type="hidden" name="idCupom" value="1">

                <article class="entity-row">
                    <div class="entity-main">
                        <div class="entity-title">PROMO20 (Aero Sul)</div>
                        <div class="entity-meta">Desconto: 20% | Quantidade: 25</div>
                    </div>
                </article>

                <div class="action-links">
                    <a href="cupom-listar.html">Cancelar</a>
                    <button class="confirm-delete-btn" type="submit">Confirmar</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
